# Full local stack: Qdrant server + API + Streamlit UI.
#   cp .env.example .env   # add GROQ_API_KEY
#   docker compose up --build
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on: [qdrant]

  ui:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./ui:/app/ui"]
    command: sh -c "pip install -q streamlit requests && streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0"
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_storage:
